appId: com.shillepython.ainotes
productName: AI Notes
directories:
  buildResources: resources
files:
  - out/**
  - package.json
  # onnxruntime-node ships binaries for every OS; only macOS ones are needed.
  - '!node_modules/onnxruntime-node/bin/napi-v*/{linux,win32}/**'
asarUnpack:
  - node_modules/onnxruntime-node/**
  - node_modules/onnxruntime-common/**
  - node_modules/sharp/**
  - node_modules/@img/**
mac:
  target:
    - target: dmg
      arch: arm64
  icon: resources/icon.png
  category: public.app-category.productivity
  # Personal build without an Apple Developer ID: ad-hoc signature (required to run on
  # Apple Silicon). Hardened runtime needs a real identity and entitlements, so it's off.
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: AI Notes слушает микрофон, чтобы распознавать голосовые команды и диктовку.
dmg:
  artifactName: ${name}-${version}.${ext}
